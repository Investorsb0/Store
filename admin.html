<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaStore Admin</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f8;
    min-height:100vh;
}

#loginPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    background:white;
    width:100%;
    max-width:400px;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.login-box h1{
    text-align:center;
    margin-bottom:10px;
}

.login-box p{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.login-btn{
    background:#111;
    color:white;
}

.error{
    color:#d00;
    text-align:center;
    margin-top:15px;
}

#adminPage{
    display:none;
}

header{
    background:#111;
    color:white;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    font-size:20px;
}

.logout{
    width:auto;
    padding:9px 15px;
    background:#fff;
    color:#111;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px 20px;
}

.welcome{
    background:white;
    padding:25px;
    border-radius:12px;
    margin-bottom:20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.card h3{
    color:#777;
    margin-bottom:10px;
}

.card strong{
    font-size:28px;
}

.hidden{
    display:none !important;
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage">

    <div class="login-box">

        <h1>NovaStore Admin</h1>

        <p>Private administrator login</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Admin email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button class="login-btn" type="submit">
                Login
            </button>

        </form>

        <div id="error" class="error"></div>

    </div>

</div>


<!-- ADMIN PAGE -->
<div id="adminPage">

    <header>

        <h1>NovaStore Admin Panel</h1>

        <button class="logout" id="logoutBtn">
            Logout
        </button>

    </header>

    <div class="container">

        <div class="welcome">

            <h2>Welcome, Admin 👋</h2>

            <p id="adminEmail"></p>

        </div>

        <div class="cards">

            <div class="card">
                <h3>Products</h3>
                <strong>0</strong>
            </div>

            <div class="card">
                <h3>Orders</h3>
                <strong>0</strong>
            </div>

            <div class="card">
                <h3>Customers</h3>
                <strong>0</strong>
            </div>

            <div class="card">
                <h3>Sales</h3>
                <strong>₦0</strong>
            </div>

        </div>

    </div>

</div>


<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {

    apiKey: "AIzaSyCNrU3igTkkcQ0Z6Zq1dluKw_s_3yHovjE",

    authDomain: "novastore-6fd18.firebaseapp.com",

    databaseURL:
    "https://novastore-6fd18-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId: "novastore-6fd18",

    storageBucket:
    "novastore-6fd18.firebasestorage.app",

    messagingSenderId: "783420364153",

    appId:
    "1:783420364153:web:1b56b655e3e804726d8ba8",

    measurementId: "G-Q760SBLPLT"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


const loginPage =
document.getElementById("loginPage");

const adminPage =
document.getElementById("adminPage");

const loginForm =
document.getElementById("loginForm");

const errorBox =
document.getElementById("error");

const logoutBtn =
document.getElementById("logoutBtn");

const adminEmail =
document.getElementById("adminEmail");


loginForm.addEventListener("submit", async (e) => {

    e.preventDefault();

    errorBox.textContent = "";

    const email =
    document.getElementById("email").value.trim();

    const password =
    document.getElementById("password").value;

    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    } catch(error) {

        console.log(error);

        errorBox.textContent =
        "Invalid admin email or password.";

    }

});


onAuthStateChanged(auth, (user) => {

    if(user){

        loginPage.style.display = "none";

        adminPage.style.display = "block";

        adminEmail.textContent =
        user.email;

    }else{

        loginPage.style.display = "flex";

        adminPage.style.display = "none";

    }

});


logoutBtn.addEventListener("click", async () => {

    await signOut(auth);

});

</script>

</body>
</html>
